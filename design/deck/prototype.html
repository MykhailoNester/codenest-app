const E = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstChild; };
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

const STATE_WORD = { block: "blocking", fail: "failed", wait: "waiting",
  stall: "stalled", run: "running", done: "done", todo: "queued", idle: "inert" };
const stateCell = (s) => {
  const k = s || "idle";
  return `<span class="dk-s" role="gridcell" data-s="${k}" aria-label="${STATE_WORD[k] || k}"></span>`;
};
const plain = (h) => String(h).replace(/<[^>]*>/g, "").replace(/&nbsp;/g, " ").trim();

/* The whole app is this one function. Every session, task, agent, project,
   run and alert below goes through it. */
function line(cells, o = {}) {
  const cls = ["dk-line", o.done && "is-done", o.fresh && "is-new", o.on && "on"].filter(Boolean).join(" ");
  const body = cells.map((c) => {
    if (c === null) return "<span></span>";
    const [txt, kind] = Array.isArray(c) ? c : [c, ""];
    const t = plain(txt);
    const tip = t.length > 28 ? ` title="${esc(t)}"` : "";
    return `<span class="${kind}" role="gridcell"${tip}>${txt}</span>`;
  }).join("");
  return `<div class="${cls}" role="row" tabindex="-1"${o.go ? ` data-go="${o.go}"` : ""}>${stateCell(o.s)}${body}</div>`;
}
const head = (cells, cls = "") =>
  `<div class="dk-head" role="row"><span role="columnheader"><span class="sr">state</span></span>${cells
    .map((c) => `<span class="${/^r /.test(c) ? "r" : ""}" role="columnheader">${c.replace(/^r /, "")}</span>`)
    .join("")}</div>`;
const group = (label, n, note, body, s) =>
  `<div class="dk-group"><h2 class="dk-group__h"${s ? ` data-s="${s}"` : ""}><span>${label}</span><span class="n">${n}</span>${note ? `<span class="note">${note}</span>` : ""}</h2>${body}</div>`;

/* Gives every list its grid semantics and one keyboard model: Up/Down move,
   Home/End jump, Enter/Space activate. A console should be drivable without
   the mouse, and this is also what makes the columns legible to a screen
   reader — a flat run of buttons told it nothing. */
function enhanceGrids(root) {
  for (const list of root.querySelectorAll(".dk-list")) {
    list.setAttribute("role", "grid");
    const label = list.closest(".dk-group")?.querySelector(".dk-group__h");
    if (label) list.setAttribute("aria-label", plain(label.textContent));

    const rows = [...list.querySelectorAll(".dk-line")];
    list.setAttribute("aria-rowcount", String(rows.length));
    rows.forEach((r, i) => {
      r.setAttribute("aria-rowindex", String(i + 1));
      r.tabIndex = i === 0 ? 0 : -1;
    });

    list.addEventListener("keydown", (e) => {
      const rs = [...list.querySelectorAll(".dk-line")];
      const at = rs.indexOf(document.activeElement);
      if (at < 0) return;
      let to = -1;
      if (e.key === "ArrowDown") to = Math.min(at + 1, rs.length - 1);
      else if (e.key === "ArrowUp") to = Math.max(at - 1, 0);
      else if (e.key === "Home") to = 0;
      else if (e.key === "End") to = rs.length - 1;
      else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        rs[at].click();
        return;
      } else return;
      e.preventDefault();
      rs[at].tabIndex = -1;
      rs[to].tabIndex = 0;
      rs[to].focus();
    });
  }
}

const page = document.getElementById("page");

function show(k, label) {
  const render = SCREENS[k] || SCREENS.stub;
  page.className = "dk-page" + (k === "session" ? " flush" : "");
  page.innerHTML = render();
  if (!SCREENS[k]) {
    const t = document.getElementById("stubT");
    if (t) t.textContent = (label || k) + " — not in this prototype";
  }
  for (const b of nav.querySelectorAll(".dk-nav")) b.classList.toggle("on", b.dataset.k === k);
  for (const b of page.querySelectorAll("[data-go]")) b.onclick = () => show(b.dataset.go);
  enhanceGrids(page);
  page.scrollTop = 0;
}

for (const b of nav.querySelectorAll(".dk-nav")) b.onclick = () => show(b.dataset.k, b.dataset.l);

const root = document.documentElement;
const pair = (aId, bId, attr, aVal, bVal) => {
  const a = document.getElementById(aId), b = document.getElementById(bId);
  a.onclick = () => { root.dataset[attr] = aVal; a.classList.add("on"); b.classList.remove("on"); };
  b.onclick = () => { root.dataset[attr] = bVal; b.classList.add("on"); a.classList.remove("on"); };
};

pair("cOn", "cOff", "colour", "on", "off");
