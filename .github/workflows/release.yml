name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to release (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag and assert it matches tauri.conf.json
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="$(jq -r '.version' src-tauri/tauri.conf.json)"
          echo "tag=$TAG | version=$VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match tauri.conf.json version 'v$VERSION'."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          draft: true
          target_commitish: ${{ github.sha }}

  build:
    name: Build DMG (aarch64)
    needs: draft
    # macos-latest is Apple Silicon (arm64). For an Intel DMG, add a native
    # macos-13 (x86_64) leg here — the sidecar can't be cross-compiled.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # pyinstaller lives in the venv; both this step and tauri-action's
      # beforeBuildCommand rebuild the sidecar, so the venv must exist first.
      - name: Create Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build sidecar natively
        run: bash scripts/build-sidecar.sh

      # Signing is deliberately not wired up: releases are ad-hoc signed and
      # users clear the quarantine flag themselves (see docs/install.md).
      #
      # Do NOT reintroduce `APPLE_*: ${{ secrets.APPLE_* }}` env entries here
      # unconditionally. A secret that does not exist interpolates to an empty
      # string rather than being omitted, and Tauri's bundler tests only for the
      # variable's presence — an empty APPLE_CERTIFICATE makes it attempt
      # `security import` with no certificate data and fail the bundle step with
      # "SecKeychainItemImport: One or more parameters ... were not valid".
      # When a Developer ID certificate is available, gate the env block behind
      # `if: ${{ secrets.APPLE_CERTIFICATE != '' }}` on a separate step.
      - name: Build and attach DMG
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}

  # The maintainer publishes the draft release manually after downloading and
  # smoke-testing the DMG (ad-hoc signed; see docs/install.md).
