name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to release (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag and assert it matches tauri.conf.json
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="$(jq -r '.version' src-tauri/tauri.conf.json)"
          echo "tag=$TAG | version=$VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match tauri.conf.json version 'v$VERSION'."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          draft: true
          target_commitish: ${{ github.sha }}

  build:
    name: Build DMG (aarch64)
    needs: draft
    # macos-latest is Apple Silicon (arm64). For an Intel DMG, add a native
    # macos-13 (x86_64) leg here — the sidecar can't be cross-compiled.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pyinstaller lives in the venv; both this step and tauri-action's
      # beforeBuildCommand rebuild the sidecar, so the venv must exist first.
      - name: Create Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build sidecar natively
        run: bash scripts/build-sidecar.sh

      # tauri-action's published major tag is v0 (it supports Tauri 2). When the
      # APPLE_* secrets are empty (forks, or before signing is configured), Tauri
      # skips real signing and produces an ad-hoc-signed DMG.
      - name: Build and attach DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}

  # The maintainer publishes the draft release manually after downloading and
  # smoke-testing the DMG (ad-hoc signed; see docs/install.md).
