<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Codenest">
  <title>Codenest</title>
  <defs>
    <linearGradient id="cnC-bg" x1="64" y1="48" x2="448" y2="468" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#161b25"/>
    </linearGradient>
    <linearGradient id="cnC-hex" x1="118" y1="96" x2="395" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="cnC-sheen" cx="0.32" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cnC-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#3b82f6" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#cnC-bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#cnC-sheen)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="112.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- hexagonal nest cell -->
  <path d="M256 92 L398 174 L398 338 L256 420 L114 338 L114 174 Z"
        fill="none" stroke="url(#cnC-hex)" stroke-width="26" stroke-linejoin="round"/>

  <!-- terminal prompt: chevron + cursor, centered -->
  <g filter="url(#cnC-glow)">
    <path d="M190 206 L248 256 L190 306" fill="none" stroke="#eaf1ff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="272" y="290" width="50" height="22" rx="11" fill="#7dd3fc"/>
  </g>
</svg>
