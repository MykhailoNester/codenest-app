[package]
name = "app"
version = "0.2.0"
description = "Codenest — desktop command center for AI agent teams"
authors = ["Mykhailo Nester"]
license = "LicenseRef-FSL-1.1-ALv2"
repository = "https://github.com/MykhailoNester/codenest-app"
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Name the binary "Codenest" so the dev process (and the macOS dock label in
# `tauri dev`, which uses the raw binary filename) reads "Codenest" rather than
# the package name. Matches `mainBinaryName` in tauri.conf.json. Declaring this
# explicit target with path = src/main.rs disables auto-discovery of the
# package-named "app" binary, so only "Codenest" is built.
[[bin]]
name = "Codenest"
path = "src/main.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
libc = "0.2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# Filesystem watching for the workspace navigator. The debouncer is what pairs
# rename From/To into a single event via filesystem IDs; plain notify reports a
# move as an unrelated remove + create. Default features give FSEvents on macOS
# (one cheap kernel watch per tree) and inotify on Linux.
notify = "8.2"
notify-debouncer-full = "0.7"

